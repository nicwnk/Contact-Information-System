server {
    listen 80;
    listen [::]:80;
    client_max_body_size 10m;   # contacts can include a base64 profile picture

    location = /healthz {
        return 200 "ok\n";
    }

    # /api/contacts/...  ->  service-a  (prefix is stripped)
    location /api/contacts/ {
        proxy_pass http://service-a:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/contacts {
        proxy_pass http://service-a:3000/;
    }

    # /api/validate/...  ->  service-b  (prefix is stripped)
    location /api/validate/ {
        proxy_pass http://service-b:3000/;
        proxy_set_header Host $host;
    }

    # everything else -> frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
